apply plugin: 'com.android.application'

// Version, kept in one file so it is raised in one place (see version.properties).
def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

// Release signing. The upload key never goes in Git: its details come from
// android/keystore.properties (see keystore.properties.example) or, on a
// build server, from FNPH_UPLOAD_* environment variables.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def canSignRelease = signingValue('storeFile', 'FNPH_UPLOAD_STORE_FILE') != null

android {
    namespace = "ng.fnphkaduna.patient"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ng.fnphkaduna.patient"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(versionProps.getProperty('VERSION_CODE'))
        versionName versionProps.getProperty('VERSION_NAME')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(signingValue('storeFile', 'FNPH_UPLOAD_STORE_FILE'))
                storePassword signingValue('storePassword', 'FNPH_UPLOAD_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'FNPH_UPLOAD_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'FNPH_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Off for the first release: shrinking can strip classes the
            // Capacitor plugins load by name. Turn on only with a full device test.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/*
  A release must never carry a test build of the web app. Checks what
  npm run android:sync copied in, before any release build or bundle:
  no Chrome debugging, no plain http, no local API address, no browser
  preview build. Fix by running npm run android:sync without test settings.
*/
tasks.register('checkReleaseWebAssets') {
    doLast {
        def problems = []
        def config = file('src/main/assets/capacitor.config.json')
        def page = file('src/main/assets/public/index.html')
        if (!config.exists() || !page.exists()) {
            problems << 'the web app is missing: run npm run android:sync'
        } else {
            def json = new groovy.json.JsonSlurper().parse(config)
            if (json.android?.webContentsDebuggingEnabled) problems << 'Chrome debugging is on (CAP_DEBUG=1)'
            if (json.server?.cleartext) problems << 'plain http is allowed (CAP_CLEARTEXT=1)'
            def html = page.text
            if (html =~ /connect-src[^;]*(localhost|10\.0\.2\.2|http:\/\/)/) problems << 'the API address is local or not https'
            if (html.contains('name="fnph-build" content="preview"')) problems << 'this is a browser preview build (VITE_NATIVE_PREVIEW=1)'
        }
        if (!canSignRelease) problems << 'no upload key: add android/keystore.properties (see keystore.properties.example)'
        if (!problems.isEmpty()) {
            throw new GradleException('Not a releasable build: ' + problems.join('; ') + '.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseWebAssets' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
